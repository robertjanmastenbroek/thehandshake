{% extends "base.html" %}
{% block title %}Agent — {{ slug }} — thehandshake.io{% endblock %}

{% block content %}
<section class="bg-white border-b border-gray-200">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Breadcrumb -->
    <div class="text-sm text-gray-500 mb-6">
      <a href="/agents" class="hover:text-brand-600">Agents</a>
      <span class="mx-2">/</span>
      <span class="text-gray-900 font-medium">{{ slug }}</span>
    </div>

    <!-- Agent info loaded via HTMX -->
    <div id="agent-detail"
         hx-get="/api/agents/{{ slug }}"
         hx-trigger="load"
         hx-swap="innerHTML">
      <div class="animate-pulse space-y-4">
        <div class="h-8 bg-gray-200 rounded w-1/3"></div>
        <div class="h-4 bg-gray-200 rounded w-2/3"></div>
        <div class="h-4 bg-gray-200 rounded w-1/2"></div>
        <div class="h-24 bg-gray-200 rounded"></div>
      </div>
    </div>

    <!-- Pricing & CTA (static for now) -->
    <div class="mt-10 bg-gray-50 rounded-2xl p-8 border border-gray-200">
      <h3 class="text-xl font-semibold text-gray-900 mb-4">Get Access</h3>
      <div class="flex flex-col sm:flex-row items-start sm:items-center gap-6">
        <div>
          <p class="text-3xl font-bold text-gray-900" id="agent-price">—</p>
          <p class="text-sm text-gray-500 mt-1" id="agent-price-label">per call</p>
        </div>
        <div class="flex gap-3 flex-wrap">
          <button id="buy-once-btn"
                  class="px-6 py-2.5 text-sm font-semibold text-white bg-brand-600 rounded-xl hover:bg-brand-700 transition-colors shadow-sm">
            Buy One-Time Access
          </button>
          <button id="subscribe-btn"
                  class="px-6 py-2.5 text-sm font-semibold text-brand-700 bg-brand-50 border border-brand-200 rounded-xl hover:bg-brand-100 transition-colors">
            Subscribe Monthly
          </button>
          <button id="execute-btn"
                  class="px-6 py-2.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-xl hover:bg-gray-50 transition-colors">
            Try Now
          </button>
        </div>
      </div>
    </div>

    <!-- Placeholder for agent description / details -->
    <div id="agent-description" class="mt-10 prose max-w-none">
      <p class="text-gray-600">Loading details…</p>
    </div>
  </div>
</section>

<!-- Simple JS to wire up buttons from API response data -->
<script>
document.body.addEventListener('htmx:afterSwap', function(evt) {
  if (evt.detail.target.id === 'agent-detail') {
    const data = JSON.parse(evt.detail.xhr.responseText);
    const priceEl = document.getElementById('agent-price');
    const labelEl = document.getElementById('agent-price-label');
    if (data.price_per_call_cents > 0) {
      priceEl.textContent = '$' + (data.price_per_call_cents / 100).toFixed(2);
      labelEl.textContent = 'per call';
    } else if (data.subscription_price_cents > 0) {
      priceEl.textContent = '$' + (data.subscription_price_cents / 100).toFixed(2);
      labelEl.textContent = '/ month';
    } else {
      priceEl.textContent = 'Free';
      labelEl.textContent = 'no cost';
    }
  }
});
</script>
{% endblock %}
